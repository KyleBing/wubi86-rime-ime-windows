# 打 Release 安装包并发布到本仓库的 Releases。
# 推送 v1.0.2 这类标签时自动编译服务进程、TSF（x64 + x86）和 Inno Setup 安装包；
# 手动运行只打包，产物留在 Actions 里。
#
# 附件名固定为 MeifengWubi-Windows-setup.exe，不带版本号，说明站因此可以一直用
#   https://github.com/KyleBing/wubi86-rime-ime-windows/releases/latest/download/MeifengWubi-Windows-setup.exe
# 这条链接，发新版本只换附件，不用改文档。版本号看 Release 标题。
# 同时会生成 update.json（带 sha256 和大小），客户端用它判断有没有新版本。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 固定附件名：releases/latest/download/<这个名字> 是稳定地址
  ASSET_NAME: MeifengWubi-Windows-setup.exe

jobs:
  windows:
    name: 打包安装程序
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # build.ps1 找不到 iscc 时会跳过安装包，这里先装好
      # 简体中文语言文件由 installer/ChineseSimplified.isl 提供，不依赖安装目录
      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      # 版本号以 csproj 的 Version 为准，发版前先改版本再打标签
      - name: 读取版本
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src/MeifengWubi/MeifengWubi.csproj
          $version = @($csproj.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "csproj 里读不到 Version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "版本 $version，标签 $env:GITHUB_REF_NAME"

      - name: 校验标签与版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expect = "v${{ steps.version.outputs.version }}"
          if ($env:GITHUB_REF_NAME -ne $expect) {
            throw "标签 $env:GITHUB_REF_NAME 与 csproj 里的 $expect 不一致，先改版本号再打标签"
          }

      - name: 单元测试
        shell: pwsh
        run: dotnet test tests/Meifeng.Core.Tests/Meifeng.Core.Tests.csproj --nologo -v q

      # 会先下载 librime 预编译包，再编译服务进程、两份 TSF DLL 和安装包
      - name: 编译并打包
        shell: pwsh
        env:
          # fetch-librime.ps1 用它调 GitHub API，避免共享 IP 撞上未认证限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 输出同时落盘到 build.log：脚本抛错时管道会中断，文件里也留有已产生的部分
          & ./build.ps1 *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build.log -Tail 15) -join ' ⏎ '
            Write-Host "::error title=build.ps1 失败（退出码 $LASTEXITCODE）::$tail"
            exit $LASTEXITCODE
          }

      # 失败时把完整日志发到 ci-logs 这个预发布里，未登录也能下载查看
      - name: 失败时发布日志
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path build.log)) { "没有捕获到输出" | Set-Content build.log -Encoding utf8 }
          gh release view ci-logs *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload ci-logs build.log --clobber
          } else {
            gh release create ci-logs build.log -t "CI 日志" -n "打包失败时的完整输出，可随时删除。" -p
          }
          if ($LASTEXITCODE -ne 0) { Write-Host "上传日志失败，忽略。" }

      - name: 收集安装包
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $setup = "out/MeifengWubi-$version-setup.exe"
          if (-not (Test-Path $setup)) { throw "找不到安装包 $setup" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # 固定附件名，避免各端下载链接带版本号
          Copy-Item $setup "dist/$env:ASSET_NAME"
          Get-ChildItem dist | Format-Table Name, Length

      # 更新说明直接取 CHANGELOG.md 里对应版本的那一段
      - name: 生成更新说明
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $lines = Get-Content CHANGELOG.md
          $head = "## v$version"
          $body = @()
          $show = $false
          foreach ($line in $lines) {
            if ($line.StartsWith($head)) { $show = $true; continue }
            if ($line.StartsWith("## v")) { $show = $false }
            if ($show) { $body += $line }
          }
          $text = ($body -join "`n").Trim()
          if (-not $text) { $text = "v$version" }
          Set-Content -Path notes.md -Value $text -Encoding utf8
          Get-Content notes.md

      # 客户端只读这个附件：releases/latest/download/update.json
      # 清单里带 SHA-256 和大小，下载后先校验再启动安装器
      - name: 生成更新清单
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $asset = "dist/$env:ASSET_NAME"
          if (-not (Test-Path $asset)) { throw "找不到安装包 $asset" }
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $repo = $env:GITHUB_REPOSITORY
          $manifest = [ordered]@{
            schema = 1
            platform = "windows"
            channel = "stable"
            version = $version
            build = 0
            published_at = (Get-Date -Format "yyyy-MM-dd")
            download_url = "https://github.com/$repo/releases/latest/download/$env:ASSET_NAME"
            sha256 = $hash
            size = (Get-Item $asset).Length
            min_system = "10.0.19041"
            minimum_version = "1.0.0"
            notes = (Get-Content notes.md -Raw).Trim()
            notes_url = "https://github.com/$repo/releases/tag/$env:GITHUB_REF_NAME"
          }
          Set-Content -Path "dist/update.json" -Value ($manifest | ConvertTo-Json -Depth 4) -Encoding utf8
          Get-Content "dist/update.json"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MeifengWubi-${{ steps.version.outputs.version }}-windows
          path: dist/*
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 不因非零退出码中断，下面按 $LASTEXITCODE 判断已有 / 新建
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $title = "v${{ steps.version.outputs.version }}"
          $asset = (Get-Item "dist/$env:ASSET_NAME").FullName
          $manifest = (Get-Item "dist/update.json").FullName
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title --notes-file notes.md --latest
            gh release upload $tag $asset $manifest --clobber
          } else {
            gh release create $tag $asset $manifest --title $title --notes-file notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "发布 Release 失败" }
          Write-Host "已发布：https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
          Write-Host "固定下载：https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/$env:ASSET_NAME"
          Write-Host "更新清单：https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/update.json"
